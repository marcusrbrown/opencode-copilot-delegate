---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup mise (bun, opencode, copilot)
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true
          cache: true

      - name: Cache bun install
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Node ESM export-shape smoke test
        run: |
          node --input-type=module -e "
            import('./dist/index.js').then(m => {
              const keys = Object.keys(m).sort();
              if (keys.length !== 1 || keys[0] !== 'default') {
                console.error('Plugin entry exposed unexpected named exports: ' + keys.join(', '));
                console.error('Move helpers to src/lib/ — plugin entry must export only default; see docs/solutions or memory pattern for the v2.5.0/v2.12.1 regression class.');
                process.exit(1);
              }
              if (typeof m.default !== 'function') {
                console.error('Plugin default export is not a function');
                process.exit(1);
              }
              console.log('Export shape OK: only default, typeof=function');
            });
          "

      - name: Unit tests
        run: bun run test:unit
