---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise (bun, opencode, copilot)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          cache: true

      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26

      - name: Node ESM export-shape smoke test
        run: |
          node --input-type=module -e "
            import('./dist/index.js').then(m => {
              const keys = Object.keys(m).sort();
              if (keys.length !== 1 || keys[0] !== 'default') {
                console.error('Plugin entry exposed unexpected named exports: ' + keys.join(', '));
                console.error('Move helpers to src/lib/ — plugin entry must export only default; see docs/solutions or memory pattern for the v2.5.0/v2.12.1 regression class.');
                process.exit(1);
              }
              const entry = m.default;
              const shape = Object.keys(entry ?? {}).sort().join(',');
              if (shape !== 'id,server,setup' || typeof entry.server !== 'function' || typeof entry.setup !== 'function') {
                console.error('Plugin default must be the dual-host object { id, server, setup }; got: ' + shape);
                process.exit(1);
              }
              console.log('Export shape OK: only default { id, server, setup }');
            });
          "

      - name: Node dual-host entry smoke test
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/smoke-cache
          XDG_STATE_HOME: ${{ runner.temp }}/smoke-state
        run: |
          node --input-type=module -e "
            const { default: plugin } = await import('./dist/index.js');
            const tools = ['copilot_cancel', 'copilot_delegate', 'copilot_output', 'copilot_resume'];
            const fail = (message) => { console.error(message); process.exit(1); };

            // V1: server() with a V1-shaped input returns the four tools.
            const hooks = await plugin.server({
              client: { app: { log: async () => {} }, session: { prompt: async () => {} } },
              directory: process.cwd(),
              worktree: process.cwd(),
            });
            const v1 = Object.keys(hooks.tool ?? {}).sort().join(',');
            if (v1 !== tools.join(',')) fail('V1 server() tools: ' + v1);

            // V2: setup() with a fake V2 context registers the four tools.
            const added = [];
            const cleanup = await plugin.setup({
              location: { directory: process.cwd() },
              session: { synthetic: async () => {} },
              tool: {
                transform: async (callback) => { callback({ add: (tool) => added.push(tool) }); return { dispose: async () => {} }; },
                reload: async () => {},
                list: async () => added.map((tool) => ({ ...tool, id: tool.name })),
              },
            });
            const v2 = added.map((tool) => tool.name).sort().join(',');
            if (v2 !== tools.join(',')) fail('V2 setup() tools: ' + v2);
            for (const tool of added) {
              tool.input['~standard'].jsonSchema.input({ target: 'draft-2020-12' });
            }
            if (typeof cleanup !== 'function') fail('V2 setup() returned no cleanup');
            await cleanup();
            console.log('Dual-host smoke OK: V1 server() and V2 setup() each register four tools');
            process.exit(0);
          "

      - name: Unit tests
        run: bun run test:unit
