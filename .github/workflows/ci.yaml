---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup mise (bun, opencode, copilot)
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          experimental: true
          cache: true

      - name: Cache bun install
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Node ESM export-shape smoke test
        run: |
          node --input-type=module -e "
            import('./dist/index.js').then(m => {
              const keys = Object.keys(m).sort();
              if (keys.length !== 1 || keys[0] !== 'default') {
                console.error('Plugin entry exposed unexpected named exports: ' + keys.join(', '));
                console.error('Move helpers to src/lib/ — plugin entry must export only default; see docs/solutions or memory pattern for the v2.5.0/v2.12.1 regression class.');
                process.exit(1);
              }
              if (typeof m.default !== 'function') {
                console.error('Plugin default export is not a function');
                process.exit(1);
              }
              console.log('Export shape OK: only default, typeof=function');
            });
          "

      - name: Unit tests
        run: bun run test:unit
